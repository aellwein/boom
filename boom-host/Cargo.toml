[package]
name = "boom-host"
description = "Native messaging host and CLI for boom, a git-backed bookmark manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["bookmarks", "git", "native-messaging"]
categories = ["command-line-utilities"]

[[bin]]
name = "boom"
path = "src/main.rs"

[dependencies]
boom-bookmarks = { path = "../boom-bookmarks" }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
git2 = "0.21.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
